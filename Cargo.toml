[workspace]
resolver = "2"
members = [
    "crates/pipeline-cli",
    "crates/pipeline-core",
    "crates/pipeline-config",
    "crates/pipeline-mcp",
    "crates/pipeline-memory",
    "crates/pipeline-docker",
    "crates/pipeline-github",
    "crates/pipeline-stages",
    "crates/pipeline-report",
    "crates/pipeline-digest",
    "crates/pipeline-port",
    "crates/pipeline-re",
    "crates/pipeline-spec",
    "crates/pipeline-knowledge",
    "crates/pipeline-lsp",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Pipeline contributors"]
repository = "https://github.com/azzindani/Pipeline"
rust-version = "1.85"

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "process", "io-util", "io-std", "signal", "time", "sync"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "chrono"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
regex = "1"
rmcp = { version = "1.6", features = ["server", "transport-io"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "tower-log"] }
tower-http = { version = "0.6", default-features = false, features = ["trace", "cors"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
