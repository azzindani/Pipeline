# ─────────────────────────────────────────────────────────────────────────────
# Pipeline · VPS deployment using the shared `caddy-router`.
#
# Pairs with /root/caddy-router · the central Caddy container owns :80/:443
# and routes by hostname to each project. This compose file:
#   - builds + runs the Pipeline MCP HTTP server on internal :8080
#   - creates `pipeline_net` so the router can join it as external
#   - exposes NO host ports (router reaches via the shared network)
#
# Bring up:
#   docker compose up -d --build
#
# Sanity check from the host (token comes from .env):
#   docker exec pipeline wget -qO- http://127.0.0.1:8080/health
#
# Wire the public route (one-time, after setting PIPELINE_DOMAIN in .env):
#   1. Add `pipeline_net` to /root/caddy-router/docker-compose.yml:
#         networks:
#           pipeline_net:
#             external: true
#             name: pipeline_pipeline_net
#      and add `- pipeline_net` to the caddy service's networks list.
#   2. Add this block to /root/caddy-router/Caddyfile (uses $PIPELINE_DOMAIN
#      from this project's .env, already loaded via env_file):
#         {$PIPELINE_DOMAIN} {
#             encode zstd gzip
#             reverse_proxy pipeline:8080 {
#                 header_up Host {host}
#                 transport http {
#                     read_timeout  300s
#                     write_timeout 300s
#                 }
#             }
#             log { output stdout; format console }
#         }
#   3. Add /root/Pipeline/.env to caddy-router's `env_file:` list.
#   4. cd /root/caddy-router && docker compose up -d
#
# Auth + capability gate are enforced by Pipeline itself (PIPELINE_TOKEN,
# PIPELINE_REMOTE_MODE) — Caddy adds TLS, nothing more.
# ─────────────────────────────────────────────────────────────────────────────
services:
  pipeline:
    # Default: build from the local source tree (`docker compose up -d --build`).
    # To run the image the deploy lane published to GHCR instead:
    #   export PIPELINE_IMAGE=ghcr.io/azzindani/pipeline:latest
    #   docker compose pull && docker compose up -d --no-build
    image: ${PIPELINE_IMAGE:-pipeline:latest}
    container_name: pipeline
    build:
      context: .
      dockerfile: Dockerfile
    command: ["mcp", "--transport", "http", "--bind", "0.0.0.0:8080"]
    restart: unless-stopped
    environment:
      # Auth — pick ONE. Priority: TOKENS_FILE → TOKENS → TOKEN. Pipeline
      # refuses to start with none set: /mcp is a remote-code-execution surface
      # and there is deliberately no unauthenticated mode.
      #   PIPELINE_TOKENS_FILE  → /work/tokens.json  {"alice":"sk-…","ci":"sk-…"}
      #   PIPELINE_TOKENS       → "alice:sk-…,ci:sk-…"  (named, revoke one at a time)
      #   PIPELINE_TOKEN        → single shared bearer, principal "default"
      PIPELINE_TOKENS_FILE: ${PIPELINE_TOKENS_FILE:-}
      PIPELINE_TOKENS: ${PIPELINE_TOKENS:-}
      PIPELINE_TOKEN: ${PIPELINE_TOKEN:-}
      PIPELINE_REMOTE_MODE: ${PIPELINE_REMOTE_MODE:-read_only}
      PIPELINE_BIND: 0.0.0.0:8080
      # OAuth client for the claude.ai Custom Connector. Both optional — an
      # empty secret keeps the client public (PKCE-only), which is what
      # claude.ai uses. Access/refresh tokens persist under /work/.pipeline/oauth
      # (the pipeline-memory volume), so a container bounce never forces a
      # re-authorize.
      PIPELINE_OAUTH_CLIENT_ID: ${PIPELINE_OAUTH_CLIENT_ID:-claude-ai}
      PIPELINE_OAUTH_CLIENT_SECRET: ${PIPELINE_OAUTH_CLIENT_SECRET:-}
      # Request-body ceiling on /mcp. Tool args (patches, digests, file bodies)
      # are legitimately large; the pre-auth OAuth surface is capped separately
      # and far tighter (256 KB) so an anonymous POST cannot OOM the container.
      PIPELINE_MAX_BODY_BYTES: ${PIPELINE_MAX_BODY_BYTES:-}
      RUST_LOG: ${RUST_LOG:-info}
    expose:
      - "8080"
    volumes:
      # Workspace the agent operates on. Bind-mount a host dir if you want
      # the workspace to survive `docker compose down -v` and be visible from
      # the host (mirrors Folio's ./folio-projects pattern).
      - ./pipeline-workspace:/work
      # Persistent memory · session log · run history · digests.
      - pipeline-memory:/work/.pipeline
      # Docker socket · needed for stages that build/run containers. Comment
      # out if PIPELINE_REMOTE_MODE=read_only and you want zero escalation
      # surface — but `pipeline_run` + `pipeline_deploy` will fail.
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /work
    networks:
      - pipeline_net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  pipeline_net:
    driver: bridge

volumes:
  pipeline-memory:
