# Pipeline dogfoods itself · this file is the contract Pipeline runs against its own crates.
# Schema: crates/pipeline-config/src/lib.rs · CLAUDE.md §"pipeline.yaml schema"

project: pipeline
version: 0.0.1

stack:
  runtime: rust
  services: []

stages:
  fast:
    - static
    - unit
  full:
    - static
    - unit
    - container
    - integration
  preflight:
    - static
    - unit
    - container
    - integration
    - security

gates:
  # ! Ratchet, ✗ aspiration. Measured line coverage is 61.35% (cargo-llvm-cov,
  # workspace). 70 was declared and never measured, so it gated nothing — and
  # setting a gate above the real number turns the build red for a reason no
  # single change caused. The floor sits just under today's number: it catches a
  # regression now, and moves up as coverage does. Raise it deliberately, ✗ by
  # aspiration.
  coverage: 61
  image_size_mb: 200
  critical_vulns: 0

# External Standards repo · github.com/azzindani/Standards — a dependency, not a
# vendored copy. `source` resolves it (local path | git URL | omit → cascade to
# ~/.pipeline/standards). `pin` locks the commit: upstream ✗ silently move gates.
# `project_type` · `surfaces` are keys into that repo's ROUTER.md §5 · §6 tables —
# Pipeline selects routes, it does not define them.
standards:
  # ✗ absolute path — portable to no machine but the one that wrote it. Unset →
  # cascade: PIPELINE_STANDARDS_DIR → shared cache → clone from the repo above.
  # Point `source` at a local checkout only in a throwaway override.
  project_type: MCP server
  languages: [rust]        # settles ROUTER's MCP-server language choice (python | typescript | rust)
  surfaces:
    - Command line
    - Deployed service
    - Public package
  pin: 0828bd8de09977166cb30172d26fdcb1113bd0fa

# Promotion ladder. Omitting this block yields exactly these three with these
# gates — the defaults live in pipeline-config, ✗ in this file. Declared here so
# Pipeline's own ladder is visible to anyone reading the repo.
environments:
  - name: dev
    requires: [static, unit]
  - name: staging
    requires: [static, unit, container, integration]
    tunnel: true
  - name: production
    requires: [preflight, security]
    approval: true

# deploy + maintenance wire in at v1 · see PLAN.md
