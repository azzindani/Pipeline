# Pipeline dogfoods itself · this file is the contract Pipeline runs against its own crates.
# Schema: crates/pipeline-config/src/lib.rs · CLAUDE.md §"pipeline.yaml schema"

project: pipeline
version: 0.0.1

stack:
  runtime: rust
  services: []

stages:
  fast:
    - static
    - unit
  full:
    - static
    - unit
    - container
    - integration
  preflight:
    - static
    - unit
    - container
    - integration
    - security

gates:
  coverage: 70
  image_size_mb: 200
  critical_vulns: 0

# External Standards repo · github.com/azzindani/Standards — a dependency, not a
# vendored copy. `source` resolves it (local path | git URL | omit → cascade to
# ~/.pipeline/standards). `pin` locks the commit: upstream ✗ silently move gates.
# `project_type` · `surfaces` are keys into that repo's ROUTER.md §5 · §6 tables —
# Pipeline selects routes, it does not define them.
standards:
  source: /root/Standards
  project_type: MCP server
  languages: [rust]        # settles ROUTER's MCP-server language choice (python | typescript | rust)
  surfaces:
    - Command line
    - Deployed service
    - Public package
  pin: 0828bd8de09977166cb30172d26fdcb1113bd0fa

# deploy + maintenance wire in at v1 · see PLAN.md
